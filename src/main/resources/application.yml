server:
  port: 6080
streamGroupInstance: 'localhost'
spring:
  application:
    name: TradeExecutionAggregationService
  config:
    import: "optional:consul:"
  autoconfigure:
    exclude:
      - de.codecentric.boot.admin.client.config.SpringBootAdminClientAutoConfiguration
  thread-executor: virtual
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094,localhost:9095,localhost:9096}
    producer:
      key-serializer: org.apache.kafka.common.serialization.UUIDSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    streams:
      orders-topic: oms.equity.order
      application-id: TradeExecutionAggregationService4
      state-dir: /tmp/kafka-streams/
      properties:
        default.key.serde: org.apache.kafka.common.serialization.Serdes$UUIDSerde
        default.value.serde: org.springframework.kafka.support.serializer.JsonSerde
        spring.json.trusted.packages: "*"

management:
  port: 8081
  security:
    enabled: false
  endpoints:
    web:
      exposure:
        include: '*'
        exclude: flyway,liquidbase,env
  endpoint:
    health:
      show-details: always
      probes:
        enabled: 'true'
    shutdown:
      enabled: true
