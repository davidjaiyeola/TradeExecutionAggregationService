server:
  port: 6080
spring:
  boot:
    admin:
      client:
        url: 'http://localhost:9097'
  application:
    name: TradeExecutionAggregationService
  thread-executor: virtual
  kafka:
    bootstrap-servers: '127.0.0.1:29092,127.0.0.1:29093,127.0.0.1:29094'
    producer:
      key-serializer: org.apache.kafka.common.serialization.UUIDSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    streams:
      orders-topic: oms.equity.order
      application-id: TradeExecutionAggregationService3
      state-dir: /tmp/kafka-streams/
      properties:
        default.key.serde: org.apache.kafka.common.serialization.Serdes$UUIDSerde
        default.value.serde: org.springframework.kafka.support.serializer.JsonSerde
        spring.json.trusted.packages: "*"

management:
  port: 8081
  security:
    enabled: false
  endpoints:
    web:
      exposure:
        include: '*'
        exclude: flyway,liquidbase,env
  endpoint:
    health:
      show-details: always
      probes:
        enabled: 'true'
    shutdown:
      enabled: true
